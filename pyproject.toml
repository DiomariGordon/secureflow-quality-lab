[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secureflow-quality-lab"
version = "0.3.0"
description = "A synthetic regulated-workflow application and automation portfolio lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "playwright>=1.50",
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[project.scripts]
secureflow-crypto-inventory = "secureflow.crypto_inventory:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "e2e: browser-based end-to-end tests",
  "security: security-requirement regression tests",
]

[tool.coverage.run]
source = ["secureflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
