name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-browser-tests:
    name: Unit, API, data, and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run non-browser quality gate
        run: >-
          python -m pytest -m "not e2e"
          --cov=secureflow
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-fail-under=80
          --junitxml=reports/non-browser-junit.xml
      - name: Upload non-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-browser-quality-evidence
          path: reports/
          if-no-files-found: error

  playwright-e2e:
    name: Playwright end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright quality gate
        run: python -m pytest -m e2e -vv --junitxml=reports/e2e-junit.xml
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-quality-evidence
          path: |
            reports/e2e-junit.xml
            test-results/
          if-no-files-found: warn
